<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vo confia</title>
<style>
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
  }
  *{ box-sizing:border-box; }

  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:3;
  }

  #bgWrap{
    position:fixed; inset:0; z-index:1;
    opacity:0; transition: opacity .6s ease;
  }
  #bgWrap.show{ opacity:1; }

  #bgGif{
    position:absolute; top:50%; left:50%;
    height:100%; width:auto;
    min-width:100%;
    transform:translate(-50%,-50%);
    object-fit:cover;
  }

  #overlay{
    position:fixed; inset:0; z-index:0; background:#000;
  }

  /* reproductor de audio invisible (YouTube) */
  #audioWrap{
    position:fixed; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; z-index:0;
  }

  #trustBtn{
    position:relative; z-index:3;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    font-weight:700;
    letter-spacing:.02em;
    color:#fff;
    background:transparent;
    border: 2px solid #fff;
    border-radius: 999px;
    padding: 18px 44px;
    cursor:pointer;
    transition: background .25s ease, color .25s ease, transform .2s ease;
  }
  #trustBtn:hover{ background:#fff; color:#000; transform: scale(1.04); }
  #trustBtn.hidden{ display:none; }
  #trustBtn:disabled{ opacity:.5; cursor:default; }
</style>
</head>
<body>

<div id="overlay"></div>

<div id="bgWrap">
  <img id="bgGif" src="dance.gif" alt="">
</div>

<div id="audioWrap">
  <div id="ytPlayer"></div>
</div>

<div id="stage">
  <button id="trustBtn" disabled>vo confia</button>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const btn = document.getElementById('trustBtn');
  const bgWrap = document.getElementById('bgWrap');
  let player;

  // Se carga el reproductor ya de entrada, pausado y mudo,
  // para que al apretar el botón solo haya que pedirle "sonido + play"
  // (eso el navegador SI lo respeta como gesto del usuario, en mobile también).
  function onYouTubeIframeAPIReady(){
    player = new YT.Player('ytPlayer', {
      videoId: 'zvq9r6R6QAY', // Caramella Girls - Caramelldansen (Swedish Original, Official)
      playerVars: { autoplay: 0, controls: 0, playsinline: 1, mute: 1 },
      events: {
        onReady: () => { btn.disabled = false; },
        onStateChange: onPlayerStateChange
      }
    });
  }

  function onPlayerStateChange(e){
    if (e.data === YT.PlayerState.PLAYING){
      // el gif recién aparece cuando el audio efectivamente arrancó
      bgWrap.classList.add('show');
    }
  }

  btn.addEventListener('click', () => {
    btn.classList.add('hidden');
    player.unMute();
    player.setVolume(100);
    player.playVideo();
  });
</script>

</body>
</html>
