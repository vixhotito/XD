<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vo confia</title>
<style>
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
  }
  *{ box-sizing:border-box; }

  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:3;
  }

  #bgWrap{
    position:fixed; inset:0; z-index:1;
    opacity:0; transition: opacity 1s ease;
  }
  #bgWrap.show{ opacity:1; }

  #bgGif{
    position:absolute; top:50%; left:50%;
    height:100%; width:auto;
    min-width:100%;
    transform:translate(-50%,-50%);
    object-fit:cover;
  }

  #overlay{
    position:fixed; inset:0; z-index:0; background:#000;
  }

  /* reproductor de audio invisible (YouTube) */
  #audioWrap{
    position:fixed; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; z-index:0;
  }

  #trustBtn{
    position:relative; z-index:3;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    font-weight:700;
    letter-spacing:.02em;
    color:#fff;
    background:transparent;
    border: 2px solid #fff;
    border-radius: 999px;
    padding: 18px 44px;
    cursor:pointer;
    transition: background .25s ease, color .25s ease, transform .2s ease;
  }
  #trustBtn:hover{ background:#fff; color:#000; transform: scale(1.04); }
  #trustBtn.hidden{ display:none; }
</style>
</head>
<body>

<div id="overlay"></div>

<div id="bgWrap">
  <img id="bgGif" src="dance.gif" alt="">
</div>

<div id="audioWrap">
  <iframe id="ytFrame"
    src=""
    frameborder="0"
    allow="autoplay; encrypted-media">
  </iframe>
</div>

<div id="stage">
  <button id="trustBtn">vo confia</button>
</div>

<script>
  const btn = document.getElementById('trustBtn');
  const bgWrap = document.getElementById('bgWrap');
  const frame = document.getElementById('ytFrame');

  btn.addEventListener('click', () => {
    // Audio en streaming vía YouTube (con sonido, ya hay un click de por medio)
    frame.src = 'https://www.youtube.com/embed/zvq9r6R6QAY?autoplay=1&start=0&loop=1&playlist=zvq9r6R6QAY&controls=0';
    bgWrap.classList.add('show');
    btn.classList.add('hidden');
  });
</script>

</body>
</html>
